version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: sts-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    image: sts-server:latest
    container_name: sts-app
    ports:
      - "8082:8082"
    environment:
      - SPRING_MONGODB_URI=mongodb://mongo:27017/STS-support-ticket-system
      - SPRING_MONGODB_DATABASE=STS-support-ticket-system
    depends_on:
      - mongo

volumes:
  mongo_data:
